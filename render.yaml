services:
  - type: web
    name: grant-analyst-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SESSION_PEPPER
        generateValue: true
      - key: CORS_ORIGINS
        value: https://wayan.com,https://www.wayan.com
      - key: OPENAI_ANALYSIS_MODEL
        value: gpt-5.6-terra
      - key: OPENAI_FAST_MODEL
        value: gpt-5.6-luna
      - key: MAX_DAILY_REVIEWS
        value: "20"
      - key: MAX_SESSION_DAILY_REVIEWS
        value: "2"
      - key: MAX_UPLOAD_MB
        value: "15"
